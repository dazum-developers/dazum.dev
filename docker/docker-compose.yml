x-db-env: &db-env
  PGHOST: ${PGHOST:-maple}
  PGDATABASE: ${PGDATABASE:-maple}
  POSTGRES_USER: ${POSTGRES_USER:-maple}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maple}
  POSTGRES_DB: ${POSTGRES_DB:-maple}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

services:
  maple-db:
    image: postgres:17.2-alpine3.21
    pull_policy: if_not_present
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    ports:
      - 6543:5432
    expose:
      - 6543
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
